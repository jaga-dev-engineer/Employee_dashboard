<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees - Employee Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="brand">Employee Dashboard</span>
      <nav class="nav">
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link active" href="employees.html">Employees</a>
        <button id="logout" class="btn btn-sm btn-outline-light ms-2" type="button">Sign out</button>
      </nav>
    </div>
  </header>

  <main class="container pb-5">
    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <div class="row g-2 mb-3">
      <div class="col-md-5"><input id="search" class="form-control" placeholder="Search by name, ID, email..." aria-label="Search employees"></div>
      <div class="col-md-3"><select id="loc" class="form-select" aria-label="Location"><option value="">All locations</option></select></div>
      <div class="col-md-3"><select id="mapping" class="form-select" aria-label="Mapped to Project"><option value="">All project mappings</option></select></div>
    </div>
    <p id="count" class="text-muted small"></p>

    <div class="card"><div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead><tr><th>S.no</th><th>Employee ID</th><th>Employee Name</th><th>Email</th><th>Mapped to Project</th><th>Location</th><th>Contact Number</th></tr></thead>
        <tbody id="emp-table"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
      </table>
    </div></div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/employees.js"></script>
</body>
</html>
