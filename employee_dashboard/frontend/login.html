<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Employee Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="card login-card w-100">
      <div class="card-body p-4 p-md-5">
        <h1 class="h4 mb-2">Employee Dashboard</h1>
        <p class="text-muted mb-4">Sign in with your dashboard account.</p>
        <div id="login-error" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" class="form-control" type="email" autocomplete="username" maxlength="254" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" class="form-control" type="password" autocomplete="current-password" maxlength="1024" required>
          </div>
          <button id="login-button" class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </div>
    </section>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
